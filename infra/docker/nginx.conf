worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;

    # Upstreams mapping to individual service container DNS names (Docker Compose / K8s internal domain name resolver)
    upstream auth_svc {
        server auth-service:8000;
    }

    upstream camera_svc {
        server camera-service:8000;
    }

    upstream incident_svc {
        server incident-service:8000;
    }

    upstream notification_svc {
        server notification-service:8000;
    }

    upstream admin_svc {
        server admin-service:8000;
    }

    server {
        listen 8000;
        server_name localhost;

        # ── API Routing ──────────────────────────────────────────────────────────

        # Auth Routing
        location /api/v1/auth {
            proxy_pass http://auth_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Camera Routing
        location /api/v1/cameras {
            proxy_pass http://camera_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Specific Nested Rule: Route /api/v1/incidents/{id}/notifications to Notification Service
        location ~ ^/api/v1/incidents/([^/]+)/notifications {
            proxy_pass http://notification_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Incident Routing (Generic incidents and evidence endpoint)
        location /api/v1/incidents {
            proxy_pass http://incident_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Evidence Routing (Belongs to incident service)
        location /api/v1/evidence {
            proxy_pass http://incident_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Notification Policy Routing
        location /api/v1/notification-policies {
            proxy_pass http://notification_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin Routing: Users
        location /api/v1/users {
            proxy_pass http://admin_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin Routing: Roles
        location /api/v1/roles {
            proxy_pass http://admin_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
