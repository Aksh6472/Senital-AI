apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: sentinel-ai
spec:
  ports:
    - port: 9000
      name: api
    - port: 9001
      name: console
  selector:
    app: minio

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: sentinel-ai
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - :9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: sentinel-secrets
                  key: s3-access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sentinel-secrets
                  key: s3-secret-key
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          volumeMounts:
            - name: minio-persistent-storage
              mountPath: /data
          healthcheck:
            # Check container health using minio health URL
            test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            initialDelaySeconds: 15
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: minio-persistent-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 2Gi

---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-bucket
  namespace: sentinel-ai
spec:
  template:
    spec:
      containers:
        - name: mc
          image: minio/mc:latest
          command:
            - sh
            - -c
            - |
              # Block until MinIO is up and set credentials
              until mc alias set localminio http://minio:9000 minioadmin minioadmin; do
                echo "Waiting for MinIO server to accept connections..."
                sleep 2
              done
              # Create bucket
              mc mb --ignore-existing localminio/sentinel-evidence
              exit 0
      restartPolicy: OnFailure
  backoffLimit: 4
