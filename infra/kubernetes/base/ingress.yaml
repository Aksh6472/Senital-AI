apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentinel-ingress
  namespace: sentinel-ai
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Set CORS annotations if required directly on ingress
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
spec:
  rules:
    - host: sentinel-ai.local
      http:
        paths:
          # ── Frontend Dashboard Routing ───────────────────────────
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000

          # ── Auth Service Routing ─────────────────────────────────
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8000

          # ── Camera Service Routing ───────────────────────────────
          - path: /api/v1/cameras
            pathType: Prefix
            backend:
              service:
                name: camera-service
                port:
                  number: 8000

          # ── Notification Routing (Specific Regex first) ──────────
          - path: /api/v1/incidents/[^/]+/notifications
            pathType: ImplementationSpecific
            backend:
              service:
                name: notification-service
                port:
                  number: 8000

          # ── Incident Service Routing (Generic) ───────────────────
          - path: /api/v1/incidents
            pathType: Prefix
            backend:
              service:
                name: incident-service
                port:
                  number: 8000

          # ── Evidence Service Routing (to Incident service container)
          - path: /api/v1/evidence
            pathType: Prefix
            backend:
              service:
                name: incident-service
                port:
                  number: 8000

          # ── Notification Policy Routing ──────────────────────────
          - path: /api/v1/notification-policies
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8000

          # ── Admin Service Users Routing ──────────────────────────
          - path: /api/v1/users
            pathType: Prefix
            backend:
              service:
                name: admin-service
                port:
                  number: 8000

          # ── Admin Service Roles Routing ──────────────────────────
          - path: /api/v1/roles
            pathType: Prefix
            backend:
              service:
                name: admin-service
                port:
                  number: 8000
