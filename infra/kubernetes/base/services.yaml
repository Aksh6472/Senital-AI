# ============================================================================
# 1. AUTH SERVICE
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: sentinel-ai
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: auth-service

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: sentinel-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: service
          image: sentinel-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: "auth_service"
            - name: DATABASE_USER
              valueFrom:
                configMapKeyRef:
                  name: sentinel-config
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sentinel-secrets
                  key: database-password
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: sentinel-config
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: sentinel-config
                  key: DATABASE_PORT
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: sentinel-config
                  key: DATABASE_NAME
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sentinel-secrets
                  key: jwt-secret-key
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

