# ============================================================================
# 6. FRONTEND NEXT.JS DASHBOARD
# ============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: sentinel-ai
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: frontend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: sentinel-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: web
          image: sentinel-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              value: "http://sentinel-ai.local" # Change to target host domain name in production
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
