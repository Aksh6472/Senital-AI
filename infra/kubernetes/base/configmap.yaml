apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-config
  namespace: sentinel-ai
data:
  APP_NAME: "Sentinel AI"
  APP_VERSION: "0.1.0"
  DEBUG: "false"
  CORS_ORIGINS: '["http://localhost:3000"]'
  DATABASE_HOST: "postgres"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "sentinel_ai"
  DATABASE_USER: "sentinel"
  # Connection URL string using template resolution in Pod configuration env
  REDIS_URL: "redis://redis:6379/0"
  S3_ENDPOINT_URL: "http://minio:9000"
  S3_BUCKET_NAME: "sentinel-evidence"
  SMTP_HOST: "smtp.example.com"
  SMTP_PORT: "587"
  SMTP_FROM: "noreply@sentinel-ai.local"
